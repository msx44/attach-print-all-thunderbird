<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDF Ready - Attach Print All</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f5f7;
      color: #333;
    }
    .container {
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 460px;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      font-size: 22px;
    }
    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
      word-break: break-all;
    }
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: #1557b0;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📄 PDFの結合が完了しました</h2>
    <p id="filename-display">ファイルを保存しました。</p>
    <button id="open-btn" class="btn">PDFを開く</button>
  </div>
  <script src="result.js"></script>
</body>
</html>
